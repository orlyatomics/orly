# Build (and on demand, publish) the Orly runtime image (#530).
#
# Pull requests touching the docker files build the image on BOTH supported
# architectures and gate each one with the MCP smoke pointed at the
# CONTAINERIZED server (the same smoke.mjs that gates clients/mcp against a
# host orlyi) -- no push. A version tag or a manual dispatch additionally
# pushes each arch and then stitches them into one multi-arch manifest.
#
# Why two native runners rather than buildx+QEMU (#548): the arm64 half would
# be emulated, and this image compiles the whole source tree -- 1753 build jobs,
# ~10 minutes natively. Under qemu that is hours and would blow the timeout.
# `ubuntu-24.04-arm` builds it natively in about the same time as x86, in
# parallel, and has the side benefit that every gate below (MCP smoke,
# in-container orlyc compile, REPL mode) runs ON the arm image -- so the
# published arm64 image is proven to work, not merely to build.
name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    name: build image + in-container smoke (${{ matrix.arch }})
    strategy:
      # Report both architectures even when one fails -- "arm is broken, x86 is
      # fine" is the useful signal, and fail-fast would hide it.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      # Arch-suffixed so the two matrix legs cannot collide in the registry,
      # and so a single-arch problem can be pulled and poked at directly.
      IMAGE: ghcr.io/orlyatomics/orly:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      - name: Report runner architecture
        run: uname -m

      # Plain `docker build`, not buildx: each runner is native for its own
      # architecture, so there is nothing to cross-compile or emulate.
      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Start container
        run: |
          docker run -d --name orly -p 8082:8082 "$IMAGE"
          for _ in $(seq 1 60); do
            if ss -tln | grep -q ':8082'; then exit 0; fi
            sleep 1
          done
          echo "container never opened :8082; logs:"
          docker logs orly | tail -40
          exit 1

      # The same MCP smoke that gates clients/mcp, but ORLY_URL points at the
      # container and the `sample` package is the one BAKED into the image --
      # exercising install/new_pov/call/call_batch/error against the published
      # artifact end to end.
      - name: MCP smoke against the container
        run: |
          (cd clients/ts && npm install --silent && npx tsc)
          (cd clients/mcp && npm install --silent && npx tsc)
          ORLY_URL=ws://127.0.0.1:8082/ node clients/mcp/smoke/smoke.mjs

      # The image also claims in-container package compiles (orlyc + g++ +
      # ORLY_SRC_ROOT). Gate that claim: compile a from-scratch user package
      # to a loadable .so inside the running container. (This caught a
      # missing uuid-dev in the runtime stage during development.)
      - name: In-container orlyc compile
        run: |
          docker exec orly bash -c '
            set -e
            mkdir -p /tmp/user
            printf "package #1;\nhello = (42) where {};\n" > /tmp/user/hello.orly
            cd /tmp/user && orlyc -o /tmp/user /tmp/user/hello.orly
            test -s /tmp/user/hello.1.so
          '

      # The repl entrypoint mode (#538): pipe an expression into
      # `docker run -i ... repl` (its own in-container orlyi; no port mapping
      # needed, and no clash with the container above) and assert the value
      # comes back. Gates node in the runtime stage, the baked orly-repl
      # build, and the entrypoint's background-orlyi handshake at once.
      - name: REPL mode against the image
        run: |
          printf '40 + 2;\n:quit\n' \
            | docker run -i --rm "$IMAGE" repl \
            | tee /tmp/repl-out
          grep -qE '(^|orly> )42$' /tmp/repl-out

      - name: Container logs (for diagnosis)
        if: always()
        run: docker logs orly 2>&1 | tail -60

      # Each leg pushes its own arch-tagged image; the manifest job below
      # stitches them together. Pushing per-arch tags (rather than the
      # push-by-digest dance) keeps this a plain `docker push` and leaves a
      # pullable single-arch image behind for debugging.
      - name: Push arch image to ghcr.io
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE" "ghcr.io/orlyatomics/orly:latest-${{ matrix.arch }}"
          docker push "ghcr.io/orlyatomics/orly:latest-${{ matrix.arch }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
            docker tag "$IMAGE" "ghcr.io/orlyatomics/orly:${ver}-${{ matrix.arch }}"
            docker push "ghcr.io/orlyatomics/orly:${ver}-${{ matrix.arch }}"
          fi

  manifest:
    name: publish multi-arch manifest
    needs: image
    # Only on a real publish, and only if BOTH arches built and passed their
    # gates -- a manifest listing an image that failed its smoke would be worse
    # than no manifest at all.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `imagetools create` builds a manifest list from the per-arch tags, so
      # `docker pull ghcr.io/orlyatomics/orly` resolves to the right one and
      # Apple Silicon stops printing a platform-mismatch warning on the first
      # command in the README (#548).
      - name: Stitch :latest
        run: |
          docker buildx imagetools create -t ghcr.io/orlyatomics/orly:latest \
            ghcr.io/orlyatomics/orly:latest-amd64 \
            ghcr.io/orlyatomics/orly:latest-arm64

      - name: Stitch the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF#refs/tags/}"
          docker buildx imagetools create -t "ghcr.io/orlyatomics/orly:${ver}" \
            "ghcr.io/orlyatomics/orly:${ver}-amd64" \
            "ghcr.io/orlyatomics/orly:${ver}-arm64"

      # Assert the thing this whole change exists for, rather than assuming the
      # stitch worked: the published manifest must advertise both platforms.
      - name: Verify the manifest lists both platforms
        run: |
          got=$(docker buildx imagetools inspect --raw ghcr.io/orlyatomics/orly:latest \
                  | grep -oE '"architecture":"[a-z0-9]+"' | sort -u | tr '\n' ' ')
          echo "manifest advertises: $got"
          echo "$got" | grep -q '"architecture":"amd64"'
          echo "$got" | grep -q '"architecture":"arm64"'
