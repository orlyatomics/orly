# Build (and on demand, publish) the Orly runtime image (#530).
#
# Pull requests touching the docker files build the image on BOTH supported
# architectures and gate each one with the MCP smoke pointed at the
# CONTAINERIZED server (the same smoke.mjs that gates clients/mcp against a
# host orlyi) -- no push. A version tag or a manual dispatch additionally
# pushes each arch and then stitches them into one multi-arch manifest.
#
# Why two native runners rather than buildx+QEMU (#548): the arm64 half would
# be emulated, and this image compiles the whole source tree -- 1753 build jobs,
# ~10 minutes natively. Under qemu that is hours and would blow the timeout.
# `ubuntu-24.04-arm` builds it natively in about the same time as x86, in
# parallel, and has the side benefit that every gate below (MCP smoke,
# in-container orlyc compile, REPL mode) runs ON the arm image -- so the
# published arm64 image is proven to work, not merely to build.
name: docker

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - .github/workflows/docker.yml
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    name: build image + in-container smoke (${{ matrix.arch }})
    strategy:
      # Report both architectures even when one fails -- "arm is broken, x86 is
      # fine" is the useful signal, and fail-fast would hide it.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            # Matches the Dockerfile default; the x86 leg builds in ~10 min.
            workers: 4
            timeout: 90
          - arch: arm64
            runner: ubuntu-24.04-arm
            # Back to 4: the memory-thrash theory was tested and refuted --
            # both runners are 4-core/15GB with zero swap used, and HALVING the
            # workers made it worse (>90 min at 4, >180 min at 2). The profiling
            # run then showed `jhm -c release` completing on the bare arm runner
            # in 8m06s at 4 workers, so the build is not the problem. Timeout
            # stays generous until a native arm image build has actually been
            # observed to finish.
            workers: 4
            timeout: 180
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
      packages: write
    env:
      # Arch-suffixed so the two matrix legs cannot collide in the registry,
      # and so a single-arch problem can be pulled and poked at directly.
      IMAGE: ghcr.io/orlyatomics/orly:ci-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6

      # Cores and RAM, not just the arch: the release build in the Dockerfile is
      # LTO, which is memory-hungry and largely serial at link time. When a leg
      # is slow, "how many cores and how much RAM did it have" is the first
      # question and the one that is impossible to answer after the fact.
      - name: Report runner capacity
        run: |
          uname -m
          echo "nproc: $(nproc)"
          free -g || true
          echo "JHM_WORKER_COUNT will be: ${{ matrix.workers }}"

      # Plain `docker build`, not buildx: each runner is native for its own
      # architecture, so there is nothing to cross-compile or emulate.
      # Is this build NATIVE, or is it being emulated? That is the whole question
      # after the profiling run (#548): `jhm -c release` on the bare arm runner
      # finishes in 8m06s -- faster than x86 -- while the SAME command inside
      # `docker build` on the same runner class never finished in 180 minutes. A
      # >20x gap on identical hardware is the signature of qemu, not of slow
      # codegen.
      - name: Docker and emulation state
        run: |
          docker version --format 'client={{.Client.Arch}} server={{.Server.Arch}}' || true
          echo "--- registered binfmt handlers (any qemu-* here means emulation is available):"
          ls /proc/sys/fs/binfmt_misc/ 2>/dev/null | grep -i qemu || echo "  none"
          echo "--- what arch does the base image resolve to here:"
          docker pull -q ubuntu:24.04 >/dev/null 2>&1 || true
          docker image inspect ubuntu:24.04 --format '  ubuntu:24.04 -> {{.Architecture}}' || true

      # --platform pinned explicitly rather than relying on the daemon's default.
      # If the default was resolving to amd64 on the arm runner, every RUN line
      # was going through qemu, which explains the 20x. Pinning it costs nothing
      # if the default was already correct.
      # The version has to be handed to the build: .dockerignore excludes .git,
      # so `make version`'s `git describe` finds nothing inside the container
      # and the binaries used to report "Build: unknown" even on a release tag.
      - name: Resolve the version to stamp
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
          else
            ver="dev-${GITHUB_SHA:0:12}"
          fi
          echo "ORLY_VERSION=$ver" >> "$GITHUB_ENV"
          echo "stamping: $ver"

      - name: Build image
        run: |
          docker build --platform "linux/${{ matrix.arch }}" \
            --build-arg JHM_WORKER_COUNT=${{ matrix.workers }} \
            --build-arg ORLY_VERSION="$ORLY_VERSION" \
            -t "$IMAGE" .

      # Assert the stamp landed, on every build including pull requests -- the
      # point being that this runs constantly rather than only on a publish.
      # The manifest check in this same workflow was gated to publishes only,
      # so it went unexercised until it failed its first real run (#559).
      - name: Confirm the binaries know their own version
        run: |
          got=$(docker run --rm --entrypoint orlyc "$IMAGE" --help 2>&1 \
                  | sed -n 's/^Build: //p')
          echo "orlyc reports: ${got:-<nothing>}"
          [ "$got" = "$ORLY_VERSION" ]

      - name: Confirm the built image is the intended architecture
        run: |
          got=$(docker image inspect "$IMAGE" --format '{{.Architecture}}')
          echo "built image architecture: $got (wanted ${{ matrix.arch }})"
          test "$got" = "${{ matrix.arch }}"

      - name: Start container
        run: |
          docker run -d --name orly -p 127.0.0.1:8082:8082 "$IMAGE"
          for _ in $(seq 1 60); do
            if ss -tln | grep -q ':8082'; then exit 0; fi
            sleep 1
          done
          echo "container never opened :8082; logs:"
          docker logs orly | tail -40
          exit 1

      # The same MCP smoke that gates clients/mcp, but ORLY_URL points at the
      # container and the `sample` package is the one BAKED into the image --
      # exercising install/new_pov/call/call_batch/error against the published
      # artifact end to end.
      - name: MCP smoke against the container
        run: |
          (cd clients/ts && npm install --silent && npx tsc)
          (cd clients/mcp && npm install --silent && npx tsc)
          ORLY_URL=ws://127.0.0.1:8082/ node clients/mcp/smoke/smoke.mjs

      # The MCP smoke writes, but it exits as soon as each write answers. The
      # v0.1.0 arm64 image passed it while segfaulting just AFTER the first
      # write through a POV (#578), so a smoke that never looks back cannot
      # see that shape. Write through every POV flavour, five fresh POVs
      # each, wait, and assert the server is still the same running process.
      - name: Server survives writes through every POV flavour
        run: |
          pip3 install --break-system-packages --quiet websocket-client
          PYTHONPATH=clients/python python3 - <<'PY'
          import orly
          c = orly.connect("ws://127.0.0.1:8082/")
          c.new_session()
          c.install("sample", 1)
          n = 0
          for _ in range(5):
              for kind in ("safe shared", "safe private", "fast shared", "fast private"):
                  n += 1
                  pov = c.send(f"new {kind} pov;")
                  c.call(pov, "sample", "write_val", {"n": 1000 + n, "x": n})
          print(f"{n} writes answered")
          PY
          sleep 5
          state=$(docker inspect orly --format '{{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}')
          echo "container after writes: $state"
          test "$state" = "running exit=0 restarts=0"

      # #705: inside the container orlyi must bind every interface or the -p
      # mapping can't reach it (the steps above prove it does), and compile
      # over WebSocket stays off as on a bare host.
      - name: Image listeners and remote compile (#705)
        run: |
          docker logs orly 2>&1 | grep 'listener bound to'
          docker logs orly 2>&1 | grep 'websocket listener bound to 0.0.0.0:8082; remote compile disabled' > /dev/null
          docker logs orly 2>&1 | grep 'client listener bound to 0.0.0.0:8080' > /dev/null
          PYTHONPATH=clients/python python3 - <<'PY'
          import orly
          c = orly.connect("ws://127.0.0.1:8082/")
          c.new_session()
          try:
              c.send('compile "x = 42;";')
              raise SystemExit("the image accepted compile over websocket")
          except orly.RemoteCompileDisabled as err:
              print("compile refused:", err.reply["result"])
          PY

      # The image also claims in-container package compiles (orlyc + g++ +
      # ORLY_SRC_ROOT). Gate that claim: compile a from-scratch user package
      # to a loadable .so inside the running container. (This caught a
      # missing uuid-dev in the runtime stage during development.)
      - name: In-container orlyc compile
        run: |
          docker exec orly bash -c '
            set -e
            mkdir -p /tmp/user
            printf "package #1;\nhello = (42) where {};\n" > /tmp/user/hello.orly
            cd /tmp/user && orlyc -o /tmp/user /tmp/user/hello.orly
            test -s /tmp/user/hello.1.so
          '

      # The repl entrypoint mode (#538): pipe an expression into
      # `docker run -i ... repl` (its own in-container orlyi; no port mapping
      # needed, and no clash with the container above) and assert the value
      # comes back. Gates node in the runtime stage, the baked orly-repl
      # build, and the entrypoint's background-orlyi handshake at once.
      - name: REPL mode against the image
        run: |
          printf '40 + 2;\n:quit\n' \
            | docker run -i --rm "$IMAGE" repl \
            | tee /tmp/repl-out
          grep -qE '(^|orly> )42$' /tmp/repl-out

      # Under a memory limit (#669). orlyi used to size every pool from the
      # host's free RAM, and the entrypoint pinned 4000 fiber frames (4 GiB of
      # stacks), so the image was OOM-killed while idle under --memory=1g and
      # 4g. It now sizes from the cgroup limit. memlock is unlimited here, as
      # it is on OrbStack: orlyi mlocks its pools, caches and stacks, so every
      # planned byte is resident from the start and an over-plan dies at once
      # instead of when load finally touches it. A runner's default memlock
      # limit would hide the bug. The container must start, size from the
      # cgroup, take writes and read them back, and still be running and not
      # OOM-killed afterwards.
      - name: Runs under --memory=1g (#669)
        run: |
          docker run -d --name orly1g --memory=1g --memory-swap=1g \
            --ulimit memlock=-1:-1 -p 127.0.0.1:8092:8082 "$IMAGE"
          for _ in $(seq 1 60); do
            if ss -tln | grep -q ':8092' && docker logs orly1g 2>&1 | grep -q CleanHouse; then break; fi
            sleep 1
          done
          docker logs orly1g 2>&1 | grep 'memory \(budget\|plan\)'
          docker logs orly1g 2>&1 | grep -q 'memory budget: 1024 MiB, from the cgroup limit'
          PYTHONPATH=clients/python python3 - <<'PY'
          import orly
          c = orly.connect("ws://127.0.0.1:8092/")
          c.new_session()
          c.install("sample", 1)
          pov = c.send("new safe shared pov;")
          for n in range(1, 501):
              c.call(pov, "sample", "write_val", {"n": n, "x": n * 7})
          r = orly.connect("ws://127.0.0.1:8092/")
          r.new_session()
          bad = [n for n in range(1, 501) if r.call(pov, "sample", "read_val", {"n": n}) != n * 7]
          print(f"500 writes, {500 - len(bad)} read back")
          assert not bad, bad[:5]
          PY
          sleep 5
          state=$(docker inspect orly1g --format '{{.State.Status}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}')
          echo "container after writes: $state; peak $(( $(docker exec orly1g cat /sys/fs/cgroup/memory.peak) >> 20 )) MiB"
          test "$state" = "running oom=false restarts=0"

      # The negative control: the same container with the cgroup hidden from
      # orlyi (an empty tmpfs over /sys/fs/cgroup; the kernel still enforces the
      # limit). orlyi then sizes as if unlimited, for the entrypoint's default
      # 4 GiB budget, which is what every build before #669 did. That must be
      # OOM-killed, or the step above isn't testing the fix.
      - name: Negative control, cgroup hidden, must be OOM-killed (#669)
        run: |
          docker run -d --name orly1g-ctl --memory=1g --memory-swap=1g \
            --ulimit memlock=-1:-1 --tmpfs /sys/fs/cgroup "$IMAGE"
          for _ in $(seq 1 60); do
            if [ "$(docker inspect orly1g-ctl --format '{{.State.Running}}')" != true ]; then break; fi
            sleep 1
          done
          docker logs orly1g-ctl 2>&1 | grep 'memory budget' || true
          state=$(docker inspect orly1g-ctl --format '{{.State.Status}} oom={{.State.OOMKilled}}')
          echo "control: $state"
          test "$state" = "exited oom=true"

      # #710: the image takes the shared secret the recommended way, a token
      # file mounted read-only and named by ORLY_AUTH_TOKEN_FILE, which the
      # entrypoint passes through to orlyi. Its listeners must say a token is
      # required, a client without it or with a wrong one must be refused as
      # unauthorized, and one with it served. (A container without a token is
      # the one the steps above already exercise unchanged.)
      - name: Image honours a shared secret (#710)
        run: |
          mkdir -p /tmp/orly-secret
          od -An -tx1 -N24 /dev/urandom | tr -d ' \n' > /tmp/orly-secret/token
          docker run -d --name orlyauth --memory=1g --memory-swap=1g \
            --ulimit memlock=-1:-1 -p 127.0.0.1:8093:8082 \
            -v /tmp/orly-secret/token:/run/secrets/orly_token:ro \
            -e ORLY_AUTH_TOKEN_FILE=/run/secrets/orly_token "$IMAGE"
          for _ in $(seq 1 60); do
            if ss -tln | grep -q ':8093' && docker logs orlyauth 2>&1 | grep -q CleanHouse; then break; fi
            sleep 1
          done
          docker logs orlyauth 2>&1 | grep 'websocket listener bound to 0.0.0.0:8082; remote compile disabled; token required'
          ORLY_AUTH_TOKEN_FILE=/tmp/orly-secret/token PYTHONPATH=clients/python python3 - <<'PY'
          import orly
          url = "ws://127.0.0.1:8093/"
          try:
              orly.connect(url, token="0123456789abcdef-not-the-token", retries=0)
              raise SystemExit("the image accepted a wrong token")
          except orly.Unauthorized:
              print("wrong token refused")
          ok = orly.connect(url)  # the token from ORLY_AUTH_TOKEN_FILE
          print("session with the token:", ok.new_session())
          PY
          PYTHONPATH=clients/python python3 - <<'PY'
          import orly
          c = orly.connect("ws://127.0.0.1:8093/", retries=0)
          try:
              c.new_session()
              raise SystemExit("the image served a client with no token")
          except orly.Unauthorized:
              print("no token refused")
          PY
          if docker logs orlyauth 2>&1 | grep -qF "$(cat /tmp/orly-secret/token)"; then
            echo "the token is in the container log"; exit 1
          fi
          docker rm -f orlyauth

      - name: Container logs (for diagnosis)
        if: always()
        run: |
          docker logs orly 2>&1 | tail -60
          for c in orly1g orly1g-ctl; do
            echo "--- $c"
            docker logs "$c" 2>&1 | grep -v 'TRunnerCons\|Scheduler TID\|RUNNER \[' | tail -20 || true
          done

      # Each leg pushes its own arch-tagged image; the manifest job below
      # stitches them together. Pushing per-arch tags (rather than the
      # push-by-digest dance) keeps this a plain `docker push` and leaves a
      # pullable single-arch image behind for debugging.
      - name: Push arch image to ghcr.io
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE" "ghcr.io/orlyatomics/orly:latest-${{ matrix.arch }}"
          docker push "ghcr.io/orlyatomics/orly:latest-${{ matrix.arch }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/}"
            docker tag "$IMAGE" "ghcr.io/orlyatomics/orly:${ver}-${{ matrix.arch }}"
            docker push "ghcr.io/orlyatomics/orly:${ver}-${{ matrix.arch }}"
          fi

  manifest:
    name: publish multi-arch manifest
    needs: image
    # Only on a real publish, and only if BOTH arches built and passed their
    # gates -- a manifest listing an image that failed its smoke would be worse
    # than no manifest at all.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # `imagetools create` builds a manifest list from the per-arch tags, so
      # `docker pull ghcr.io/orlyatomics/orly` resolves to the right one and
      # Apple Silicon stops printing a platform-mismatch warning on the first
      # command in the README (#548).
      - name: Stitch :latest
        run: |
          docker buildx imagetools create -t ghcr.io/orlyatomics/orly:latest \
            ghcr.io/orlyatomics/orly:latest-amd64 \
            ghcr.io/orlyatomics/orly:latest-arm64

      - name: Stitch the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF#refs/tags/}"
          docker buildx imagetools create -t "ghcr.io/orlyatomics/orly:${ver}" \
            "ghcr.io/orlyatomics/orly:${ver}-amd64" \
            "ghcr.io/orlyatomics/orly:${ver}-arm64"

      # Assert the thing this whole change exists for, rather than assuming the
      # stitch worked: the published manifest must advertise both platforms.
      # Parse the index rather than grepping it. The first version of this
      # matched '"architecture":"[a-z0-9]+"' against the raw JSON, but
      # `imagetools inspect --raw` pretty-prints -- the bytes are
      # '"architecture": "amd64"', with a space -- so it matched nothing and
      # failed a manifest that was in fact correct. It shipped unexercised
      # because this job only runs on a dispatch or a tag, and the first real
      # publish was the first time it ever ran (#552).
      - name: Verify the manifest lists both platforms
        run: |
          got=$(docker buildx imagetools inspect --raw ghcr.io/orlyatomics/orly:latest \
                  | jq -r '.manifests[]?.platform | select(. != null) | "\(.os)/\(.architecture)"' \
                  | sort -u)
          echo "manifest advertises:"; echo "$got" | sed 's/^/  /'
          grep -qx 'linux/amd64' <<<"$got"
          grep -qx 'linux/arm64' <<<"$got"
