# Hunt for #564: a graceful shutdown that wedges on aarch64.
#
# Third design, and the first grounded in evidence about what actually
# reproduces it. The previous two synthesised load -- one test binary behind
# CPU spinners, then four concurrent copies of it -- and took 83 CI samples
# without a single reproduction, against a rate of about one per arm CI run.
# The concurrent-copies version also manufactured its own failures: the
# fixture's ProbeFreePort() binds port 0, reads the number and closes the
# socket before the caller binds it for real, so two copies racing for the
# same ephemeral port produce a bogus "Connection refused".
#
# The only demonstrated reproducer is `make test` itself -- 203 binaries, four
# at a time, on a machine that has already been churning for ten minutes --
# which is exactly what the arm CI job runs. jhm caches nothing between test
# runs, so looping it gives genuine repeated samples of the real condition.
#
# With #565 and #568 merged, a catch is self-describing: the fixture dumps
# every thread's state, wait channel and stack pointer, and the join names the
# replication loop that never returned.
#
# Dispatch-only, and temporary: delete it once #564 is diagnosed.
name: arm-wedge-hunt

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "How many full `make test` passes to run"
        required: false
        default: "5"

jobs:
  hunt:
    name: hunt the shutdown wedge (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - name: Capacity
        run: |
          uname -m; echo "nproc: $(nproc)"; free -g

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gcc g++ uuid-dev libgmp-dev libaio-dev \
            libsnappy-dev libreadline-dev libboost-system-dev zlib1g-dev \
            bison flex valgrind

      - name: Build the tree once
        run: make debug

      - name: Run the suite until the wedge appears
        id: hunt
        run: |
          set +e
          caught=""
          for r in $(seq 1 "${{ github.event.inputs.rounds || '5' }}"); do
            echo "==================== make test, round $r ===================="
            # Bound the round OURSELVES, well under the job cap. The first
            # reproduction of #564 hung a round for 110 minutes and the job's
            # own 120-minute timeout cut it off mid-evidence -- the artifacts
            # that mattered were never written. A round we kill is a round we
            # still have the logs for, and the loop moves on to the next
            # sample instead of the batch dying.
            #
            # stdbuf so a killed round still yields everything jhm wrote up to
            # the kill, rather than losing the last block-buffered chunk.
            timeout -s KILL 1500 stdbuf -oL -eL \
              env PATH="$PWD/tools:$PATH" jhm --test > "/tmp/suite.$r.log" 2>&1
            rc=$?
            if [ $rc -eq 137 ]; then
              echo "round $r was killed at its 25-minute bound (a hung suite is itself a catch)"
              caught="round $r (suite hung)"
            fi
            # The orlyi child logs are where #568's join warning actually
            # lands. The fixture only surfaces them when IT fails its own
            # assertions, so anything killed from outside loses them -- which
            # is how the first reproduction escaped. Keep them unconditionally.
            for d in /tmp/import_repl_test_*; do
              [ -d "$d" ] || continue
              tar -czf "/tmp/scratch.$r.$(basename "$d").tgz" "$d" 2>/dev/null
            done
            echo "round $r rc=$rc"
            # #568: the join names the loop that never returned.
            if grep -q "JoinReplicationServices() still waiting" "/tmp/suite.$r.log"; then
              caught="round $r"
              echo "CAUGHT -- the join reported a stalled loop:"
              grep "JoinReplicationServices() still waiting" "/tmp/suite.$r.log" | head -5
            fi
            # #565: the fixture interrogates a master that would not die.
            if grep -q "interrogating before it dies" "/tmp/suite.$r.log"; then
              caught="round $r"
              echo "CAUGHT -- thread dump from the wedged master:"
              grep -A 120 "interrogating before it dies" "/tmp/suite.$r.log"
            fi
            if grep -q "end GracefulShutdownUnresponsiveSlave; fail" "/tmp/suite.$r.log"; then
              caught="round $r"
              echo "the graceful fixture failed in round $r"
            fi
            [ -n "$caught" ] && break
          done
          [ -n "$caught" ] && echo "caught=$caught" >> "$GITHUB_OUTPUT"
          # A catch is the payload, not a build failure.
          exit 0

      - name: Upload every suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-wedge-hunt-suites
          path: |
            /tmp/suite.*.log
            /tmp/scratch.*.tgz
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          if [ -n "${{ steps.hunt.outputs.caught }}" ]; then
            echo "WEDGE CAUGHT in ${{ steps.hunt.outputs.caught }} -- the log above names the loop (#564)"
          else
            echo "no wedge in this batch; dispatch again for more samples (#564)"
          fi
