# Hunt for #564: GracefulShutdownUnresponsiveSlave wedges on aarch64.
#
# The failure is real but rare -- roughly one arm run in sixteen, and never
# once on amd64. It did not reproduce in 22 local runs on a native arm64
# container, including ten with the cores deliberately oversubscribed, so the
# way to get evidence is many samples on the runner class that actually shows
# it.
#
# #565 made the fixture interrogate a master that will not die, dumping each
# thread's state, kernel wait channel and syscall line at the one moment the
# wedged process still exists. This workflow's whole job is to make that dump
# happen: build the test alone (not the whole tree) and run it until it fails
# or the iteration budget runs out, then upload whatever it printed.
#
# Both observed failures carried load signatures -- a TransitionToSlave that
# took over two minutes -- so the runs happen against a deliberately
# oversubscribed box, mirroring `make test` running four binaries at once.
#
# Dispatch-only, and temporary: delete it, or fold it into the arm guard #556
# asks for, once #564 is diagnosed.
name: arm-wedge-hunt

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds of 4 concurrent runs (4 samples per round)"
        required: false
        default: "6"

jobs:
  hunt:
    name: hunt the shutdown wedge (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Capacity
        run: |
          uname -m
          echo "nproc: $(nproc)"
          free -g

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gcc g++ uuid-dev libgmp-dev libaio-dev \
            libsnappy-dev libreadline-dev libboost-system-dev zlib1g-dev \
            bison flex valgrind

      - name: Build the fixture and the server it forks
        run: |
          make bootstrap version
          PATH="$PWD/tools:$PATH" jhm -c debug --worker-count 4 \
            orly/server/import_replication.test orly/server/orlyi

      - name: Run until it wedges
        id: hunt
        run: |
          set +e
          TEST=../out_orly/debug/orly/server/import_replication.test
          test -x "$TEST" || { echo "no test binary at $TEST"; exit 1; }
          # Run COPIES CONCURRENTLY rather than one at a time behind CPU
          # spinners. The first version of this did the latter and took 35
          # samples without once reproducing #564, while CI reproduces it about
          # one run in sixteen -- the difference being that CI's `make test`
          # runs four real binaries at once, so the contention is for disk,
          # memory and the scheduler, not just for CPU. Concurrent copies buy
          # the right kind of load and four samples per round at the same time.
          ROUNDS=${{ github.event.inputs.rounds || '6' }}
          COPIES=4
          caught=""
          for r in $(seq 1 "$ROUNDS"); do
            echo "==================== round $r ($COPIES concurrent) ===================="
            pids=""
            for c in $(seq 1 "$COPIES"); do
              timeout -s KILL 900 "$TEST" --le --log_info > "/tmp/hunt.r$r.c$c.out" 2>&1 &
              pids="$pids $!"
            done
            for p in $pids; do wait "$p"; done
            for c in $(seq 1 "$COPIES"); do
              f="/tmp/hunt.r$r.c$c.out"
              g=$(grep -c "end GracefulShutdownUnresponsiveSlave; fail" "$f")
              i=$(grep -c "end ImportReplication; fail" "$f")
              echo "  round $r copy $c: graceful_fail=$g import_fail=$i"
              # Only the graceful fixture is what this hunt is for. An
              # ImportReplication failure is a different arm flake and must not
              # end the batch -- that is what cut the first hunt short at 15 of
              # 20 samples.
              if [ "$g" != "0" ]; then
                caught="round $r copy $c"
                echo "CAUGHT the shutdown wedge: $caught"
                echo "--- wedge dump ---"
                grep -A 200 "interrogating before it dies" "$f" || \
                  echo "(the graceful fixture failed WITHOUT a Reap timeout -- different failure mode, read the artifact)"
              fi
            done
            [ -n "$caught" ] && break
          done
          [ -n "$caught" ] && echo "caught=$caught" >> "$GITHUB_OUTPUT"
          # Report the hunt itself as successful; a caught wedge is the payload,
          # not a build failure.
          exit 0

      - name: Upload every run's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arm-wedge-hunt
          path: /tmp/hunt.*.out
          if-no-files-found: warn

      - name: Verdict
        if: always()
        run: |
          if [ -n "${{ steps.hunt.outputs.caught }}" ]; then
            echo "WEDGE CAUGHT on iteration ${{ steps.hunt.outputs.caught }} -- see the log above and the artifact (#564)"
          else
            echo "no wedge in this batch; dispatch again for more samples (#564)"
          fi
