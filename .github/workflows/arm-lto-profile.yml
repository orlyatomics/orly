# One-shot diagnostic for #548: where does the aarch64 release build spend its
# time?
#
# The multi-arch image (#552) is blocked because the arm leg never finishes
# `jhm -c release` -- >90 min at 4 workers, >180 min at 2, against 10m13s for
# the entire amd64 job. Runner capacity is identical (4 cores, 15GB, no swap
# used), so it is not resource starvation, and halving the workers made it
# WORSE, which kills the memory-thrash theory outright. The same runner class
# does `make debug` -- no LTO -- in 14m7s, slightly FASTER than x86.
#
# So the question is narrow: is the arm cost spread across compiling ~1753
# targets, or concentrated in the LTO link? Those have entirely different
# answers -- drop LTO for the image, versus chase one pathological unit -- and
# nobody should choose between them by guessing.
#
# Deliberately workflow_dispatch only: expensive, diagnostic, not a gate.
name: arm-lto-profile

on:
  workflow_dispatch:
  # TEMPORARY, and the reason is a GitHub constraint rather than a preference:
  # `workflow_dispatch` is only dispatchable once the workflow exists on the
  # DEFAULT branch, and this diagnostic needs to run before anything merges.
  # Drop this trigger (or the whole file) once #548's arm question is answered.
  push:
    branches: [feat/548-multiarch-image]

jobs:
  profile:
    name: profile jhm -c release (${{ matrix.arch }})
    strategy:
      # Both arches, so the comparison is like-for-like rather than against a
      # remembered number from a different workflow.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Long enough to actually finish if it can. If it cannot, the timestamped
    # progress still shows the SHAPE of the curve, which is the whole point.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6

      - name: Capacity
        run: |
          uname -m
          echo "nproc: $(nproc)"
          free -g

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential gcc g++ uuid-dev libgmp-dev libaio-dev \
            libsnappy-dev libreadline-dev libboost-system-dev zlib1g-dev \
            bison flex valgrind moreutils

      - name: Bootstrap
        run: make bootstrap version

      # Sample what is actually running, every 30s. If this shows `lto1` holding
      # a core for an hour, the argument is over.
      - name: Start process sampler
        run: |
          ( while true; do
              echo "--- $(date -u +%H:%M:%S)"
              ps -eo comm,etimes,pcpu,rss --sort=-pcpu | head -4
              sleep 30
            done ) > /tmp/sampler.log 2>&1 &
          echo $! > /tmp/sampler.pid

      # Timestamp every jhm line. jhm prints `[done/total] waiting: n`, so the
      # timestamps say directly whether the counter crawls (compile-bound) or
      # races to the end and then stalls (link-bound).
      - name: jhm -c release, timestamped
        run: |
          set -o pipefail
          PATH="$PWD/tools:$PATH" \
            jhm -c release --worker-count 4 orly/server/orlyi orly/orlyc \
            2>&1 | ts '[%H:%M:%S]' | tee /tmp/build.log | tail -40

      - name: Stop sampler
        if: always()
        run: kill "$(cat /tmp/sampler.pid)" 2>/dev/null || true

      # The two things worth reading even if the job was killed mid-build.
      - name: Progress curve
        if: always()
        run: |
          echo "=== first 10 timestamped lines:"
          head -10 /tmp/build.log || true
          echo "=== last 20:"
          tail -20 /tmp/build.log || true
          echo
          echo "=== when the progress counter moved (dedup'd):"
          grep -oE '^\[[0-9:]+\] \[[0-9]+/[0-9]+\]' /tmp/build.log 2>/dev/null \
            | awk '{print $2, $1}' | uniq -f1 | tail -40 || true

      - name: Sampler tail
        if: always()
        run: tail -80 /tmp/sampler.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lto-profile-${{ matrix.arch }}
          path: |
            /tmp/build.log
            /tmp/sampler.log
          if-no-files-found: warn
